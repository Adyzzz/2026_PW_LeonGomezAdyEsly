<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios con NODE</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
    <header>
        <h1>Ejercicios con NODE</h1>
    </header>

    <main>
        <section class="ejercicio">
            <h2 id="titulo-arreglos">Arreglos del código <code>01-arreglos.js</code></h2>
            <p>Datos de prueba con JS</p>
            <div class="tabla-scroll">
                <table id="tabla-talleres">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Instructor</th>
                            <th>Cupo</th>
                            <th>Inscritos</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>

            <form id="form-arreglo" class="formulario">
                <div class="campos">
                    <label for="operacion-arreglo" name="operacion-arreglo">Seleccione un ejemlo:</label>
                    <select name="operacion-arreglo" id="operacion-arreglo">
                        <option value="forEach">ForEach - Lista simple</option>
                        <option value="map">map - Copia solo nombres</option>
                        <option value="filter">filter - Filtra talleres con cupo lleno</option>
                        <option value="find">find - Buscar por el nombre del instructor</option>
                        <option value="reduce">reduce - Buscar por un valor y devolver e primer semejante a este</option>
                        <option value="map-filter">Map y filter- POr medio de una condición, solo se muestran los disp.</option>
                    </select>
                </div>

                <button type="submit">Ejecutar</button>
            </form>

            <output class="resultado" id="resultado-arreglo" for="form-arreglo"></output>
        </section>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
