<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Asistencia - CECyT 9</title>
  <link rel="stylesheet" href="./CSS/Style.css">
</head>
<body>

  <header><a href="./detalle.html">Volver al detalle del Taller</a></header>

  <main>
    <form class="form-registro" id="form-registro" novalidate>
      <h1>Formulario de registro de asistencia.</h1>

      <label for="nombre">Nombre Completo:</label>
      <input type="text" id="nombre" name="nombre" required>
      <span class="error" id="error-nombre"></span>

      <label for="nombre">Número de Boleta:</label>
      <input type="text" id="boleta" name="boleta" required>
      <span class="error" id="error-boleta"></span>

      <label for="fecha"> Fecha de registro (DD/MM/AAAA)</label>
      <input type="text" id="fecha" name="nombre" placeholder="DD/MM/AAAA" required>
      <span class="error" id="error-fecha"></span>

      <button type="submit">Registrar asientencia</button>
      <p class="mensaje-exito" id="mensaje-exito"></p>
    </form>    
  </main>

  <script src="./js/validaciones.js"></script>

</body>
</html>
